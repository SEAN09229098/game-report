<!DOCTYPE html>
<html lang="zh-Hant" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>聖姬護衛戰</title>
<style>
:root {
  --ink: #1b1726;
  --paper: #fffaf3;
  --accent: #e7b84a;
  --accent-ink: #5a3d0c;
  --panel: rgba(255, 250, 243, 0.96);
  --muted: #6b6178;
  --bg: #1d1530;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; color: var(--ink); user-select: none; -webkit-user-select: none; }
#frame { position: relative; width: min(100vw, 56.25vh); height: 100vh; height: 100dvh; margin: 0 auto; overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.scr { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 16px; background: rgba(20, 12, 35, 0.55); }
.scr[hidden], #hud[hidden] { display: none; }
h1 { margin: 0; color: #fff; font-size: clamp(32px, 9vw, 46px); letter-spacing: 0.08em; -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; }
.sub { margin: 0; color: #f3e6ff; font-size: 14px; text-align: center; line-height: 1.6; }
button { font: inherit; cursor: pointer; border: 3px solid var(--ink); border-radius: 14px; background: var(--paper); color: var(--ink); font-weight: 800; padding: 10px 18px; box-shadow: 0 4px 0 var(--ink); }
button:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }
button:disabled { opacity: 0.5; box-shadow: none; }
.primary { background: var(--accent); color: var(--accent-ink); font-size: 22px; padding: 12px 34px; }
.panel { width: 100%; max-width: 340px; background: var(--panel); border: 3px solid var(--ink); border-radius: 18px; padding: 14px; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.card { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 8px; border-radius: 12px; min-height: 76px; }
.card b { font-size: 20px; }
.card span { font-size: 12px; }
.card i { font-style: normal; color: #b07d10; font-size: 12px; margin-top: auto; }
#hud { position: absolute; inset: 0; pointer-events: none; }
#hud .top { position: absolute; top: calc(8px + env(safe-area-inset-top)); left: 8px; right: 8px; display: flex; gap: 6px; align-items: center; }
#hud button { pointer-events: auto; padding: 6px 10px; font-size: 14px; border-radius: 10px; }
#lv { flex: 1; color: #fff; font-weight: 800; text-shadow: 0 1px 0 var(--ink), 0 0 4px var(--ink); }
#throws { color: #ffe08a; font-weight: 800; text-shadow: 0 1px 0 var(--ink), 0 0 4px var(--ink); letter-spacing: 0.1em; }
#hint { position: absolute; bottom: calc(10px + env(safe-area-inset-bottom)); left: 10px; right: 10px; margin: 0; padding: 8px 10px; background: var(--panel); border: 2px solid var(--ink); border-radius: 12px; font-size: 13px; line-height: 1.5; }
#res-text { font-size: 20px; margin: 4px 0 12px; color: var(--ink); text-align: center; }
.row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="frame">
  <canvas id="cv"></canvas>
  <div id="hud" hidden>
    <div class="top">
      <button id="btn-back" type="button">選關</button>
      <button id="btn-retry" type="button">重來</button>
      <span id="lv"></span>
      <span id="throws"></span>
    </div>
    <p id="hint"></p>
  </div>
  <section id="scr-title" class="scr">
    <h1>聖姬護衛戰</h1>
    <p class="sub">刺客倒數完會同時開槍。<br>拖曳瞄準、放開擲出教主，擋子彈、撞倒刺客，或讓艾爾莎趴下。</p>
    <button id="btn-start" class="primary" type="button">開始</button>
    <p class="sub" style="font-size:12px;opacity:.8">內部試玩原型</p>
  </section>
  <section id="scr-select" class="scr" hidden>
    <div class="panel">
      <div class="grid" id="grid"></div>
      <div class="row" style="margin-top:12px"><button id="sel-back" type="button">返回</button></div>
    </div>
  </section>
  <section id="scr-result" class="scr" hidden>
    <div class="panel" style="text-align:center">
      <h2 id="res-title" style="margin:4px 0"></h2>
      <p id="res-text"></p>
      <div class="row">
        <button id="res-retry" type="button">再玩一次</button>
        <button id="res-next" type="button">下一關</button>
        <button id="res-menu" type="button">選關</button>
      </div>
    </div>
  </section>
</div>

<script>/* 守護試玩：規則與物理（不含畫面）。物理用 planck.js（Box2D），人物是會軟倒的關節人偶。
   座標：關卡用 360×640 設計像素（y 往下）撰寫；物理世界用公尺（y 往上），1 公尺＝30 設計像素。 */
(function (root) {
  "use strict";
  var pl = root.planck;
  var Vec2 = pl.Vec2;
  var PPM = 30;
  var SW = 360;
  var SH = 640;

  /* 手感參數：要調「物理碰撞幅度」改這裡就好。速度單位：公尺／秒。 */
  var TUNE = {
    gravity: -20, // 重力
    launchScale: 0.15, // 手指離教主每 1 設計像素＝多少擲出速度
    launchMax: 28, // 擲出最大速度
    bulletSpeed: 15, // 子彈速度
    fireAt: 3, // 開場幾秒後所有刺客同時開槍
    slowScale: 0.3, // 開槍瞬間的慢動作倍率
    slowTime: 1.1, // 慢動作持續秒數（真實時間）
    enemyKill: 5, // 被會動的東西（教主、木箱、鐵球…）撞到，相對速度超過這個值，刺客被擊倒
    enemyFall: 9, // 摔到地面或平台的速度超過這個值，刺客被擊倒（從高台被撞下去）
    blastR: 3.2, // 爆炸影響半徑（公尺）
    blastKillR: 2.1, // 這個距離內的刺客直接倒、人質直接失敗
    blastPower: 13, // 爆炸推力
    tntTrigger: 6, // 撞炸藥桶超過這個速度就爆
    crateBounce: 0.55, // 木箱的彈性，越大撞到牆和地面彈越多
    crateKick: 1.8, // 教主撞到木箱時，木箱拿到教主速度的幾倍（越大飛越遠）
    hostageKnock: 0.75, // 教主撞到艾爾莎時，她拿到教主速度的幾倍（越大飛越遠）
    hostageLift: 2, // 撞到艾爾莎時額外往上掀的速度
    springSpeed: 26, // 彈簧墊把人往上彈的速度（比擲出最大速度快，才能上到高處）
    scale: 1.15, // 角色大小
    winDelay: 1.2, // 最後一顆子彈結束後，等幾秒確認人質平安
  };

  function mx(px) { return px / PPM; }
  function my(py) { return (SH - py) / PPM; }

  /* 關節人偶的身體部位（公尺；原點在腳底中央，往上為正）。L＝畫面後方那一側。 */
  function partDefs(k) {
    var d = [
      { n: "uarmL", box: [0.13, 0.36], c: [-0.27, 1.37], p: "torso", j: [-0.25, 1.55], lim: [-2.8, 2.8] },
      { n: "larmL", box: [0.12, 0.34], c: [-0.27, 1.02], p: "uarmL", j: [-0.27, 1.19], lim: [-2.4, 0.05] },
      { n: "thighL", box: [0.17, 0.42], c: [-0.1, 0.74], p: "torso", j: [-0.1, 0.95], lim: [-1.6, 1.3] },
      { n: "shinL", box: [0.15, 0.5], c: [-0.1, 0.28], p: "thighL", j: [-0.1, 0.53], lim: [-0.05, 2.4] },
      { n: "torso", box: [0.42, 0.72], c: [0, 1.28] },
      { n: "thighR", box: [0.17, 0.42], c: [0.1, 0.74], p: "torso", j: [0.1, 0.95], lim: [-1.6, 1.3] },
      { n: "shinR", box: [0.15, 0.5], c: [0.1, 0.28], p: "thighR", j: [0.1, 0.53], lim: [-0.05, 2.4] },
      { n: "head", r: 0.27, c: [0, 1.9], p: "torso", j: [0, 1.63], lim: [-0.5, 0.5] },
      { n: "uarmR", box: [0.13, 0.36], c: [0.27, 1.37], p: "torso", j: [0.25, 1.55], lim: [-2.8, 2.8] },
      { n: "larmR", box: [0.12, 0.34], c: [0.27, 1.02], p: "uarmR", j: [0.27, 1.19], lim: [-2.4, 0.05] },
    ];
    return d.map(function (x) {
      return {
        n: x.n,
        box: x.box && [x.box[0] * k, x.box[1] * k],
        r: x.r && x.r * k,
        c: [x.c[0] * k, x.c[1] * k],
        p: x.p,
        j: x.j && [x.j[0] * k, x.j[1] * k],
        lim: x.lim,
      };
    });
  }

  function makeRag(st, role, feet, facing, aim) {
    var k = TUNE.scale;
    var group = ++st.groupSeq;
    var rag = { role: role, parts: {}, list: [], dormant: true, alive: true, facing: facing, group: group, aim: aim || null, feet: feet };
    var fx = mx(feet.x);
    var fy = my(feet.y);
    var defs = partDefs(k);
    defs.forEach(function (d) {
      var b = st.world.createBody({ type: "static", position: Vec2(fx + d.c[0] * facing, fy + d.c[1]) });
      var shape = d.r ? pl.Circle(d.r) : pl.Box(d.box[0] / 2, d.box[1] / 2);
      b.createFixture(shape, { density: 1, friction: 0.7, restitution: 0.05, filterGroupIndex: -group });
      b.setUserData({ kind: "part", rag: rag, part: d.n, w: d.box ? d.box[0] : d.r * 2, h: d.box ? d.box[1] : d.r * 2, round: !!d.r });
      rag.parts[d.n] = b;
      rag.list.push(b);
    });
    defs.forEach(function (d) {
      if (!d.p) return;
      var lim = facing > 0 ? d.lim : [-d.lim[1], -d.lim[0]];
      st.world.createJoint(pl.RevoluteJoint({ enableLimit: true, lowerAngle: lim[0], upperAngle: lim[1] },
        rag.parts[d.p], rag.parts[d.n], Vec2(fx + d.j[0] * facing, fy + d.j[1])));
    });
    return rag;
  }

  function wake(rag) {
    if (!rag.dormant) return;
    rag.dormant = false;
    rag.list.forEach(function (b) { b.setDynamic(); b.setAwake(true); });
  }

  function staticBox(st, s, kind) {
    var b = st.world.createBody({ type: "static", position: Vec2(mx(s.x + s.w / 2), my(s.y + s.h / 2)) });
    b.createFixture(pl.Box(s.w / PPM / 2, s.h / PPM / 2), { friction: kind === "mirror" ? 0 : 0.8, restitution: kind === "spring" ? 0 : 0.05 });
    b.setUserData({ kind: kind, w: s.w / PPM, h: s.h / PPM });
    return b;
  }

  /* 場景道具：一開始固定不動，被會動的東西碰到才開始受物理影響（木箱、木板、炸藥桶、鐵球）。 */
  function makeProp(st, p) {
    var b;
    if (p.kind === "ball") {
      b = st.world.createBody({ type: "static", position: Vec2(mx(p.ax), my(p.ay + p.len)) });
      b.createFixture(pl.Circle(p.r / PPM), { density: 6, friction: 0.4, restitution: 0.2 });
      b.setUserData({ kind: "ball", prop: true, dormant: true, r: p.r / PPM, anchor: Vec2(mx(p.ax), my(p.ay)) });
    } else {
      b = st.world.createBody({ type: "static", position: Vec2(mx(p.x + p.w / 2), my(p.y + p.h / 2)) });
      var crate = p.kind === "crate";
      b.createFixture(pl.Box(p.w / PPM / 2, p.h / PPM / 2), {
        density: p.kind === "tnt" ? 1.5 : crate ? 0.6 : 1,
        friction: crate ? 0.3 : 0.6,
        restitution: crate ? TUNE.crateBounce : 0.1,
      });
      b.setUserData({ kind: p.kind, prop: true, dormant: true, w: p.w / PPM, h: p.h / PPM });
    }
    st.props.push(b);
    return b;
  }

  function create(level) {
    var st = {
      level: level,
      world: new pl.World({ gravity: Vec2(0, TUNE.gravity) }),
      groupSeq: 0,
      statics: [],
      props: [],
      bullets: [],
      enemies: [],
      time: 0,
      acc: 0,
      slow: 0,
      fired: false,
      throwsLeft: level.throws || 1,
      status: "play",
      reason: null,
      winT: 0,
      events: [],
      queue: [],
    };
    // 地面與看不見的左右牆
    st.statics.push(staticBox(st, { x: -40, y: 600, w: 440, h: 80 }, "ground"));
    staticBox(st, { x: -30, y: -600, w: 30, h: 1300 }, "wall");
    staticBox(st, { x: SW, y: -600, w: 30, h: 1300 }, "wall");
    (level.statics || []).forEach(function (s) { st.statics.push(staticBox(st, s, s.kind || "wood")); });
    (level.props || []).forEach(function (p) { makeProp(st, p); });
    st.hostage = makeRag(st, "hostage", level.hostage, level.hostage.facing || 1);
    st.player = makeRag(st, "player", level.player, level.player.facing || 1);
    (level.enemies || []).forEach(function (e) {
      var facing = e.facing || (level.hostage.x >= e.x ? 1 : -1);
      st.enemies.push(makeRag(st, "enemy", e, facing, e.aim || null));
    });
    st.world.on("begin-contact", function (c) { onContact(st, c); });
    return st;
  }

  /* ---- 碰撞規則 ---- */
  function bodyOf(f) { return f.getBody(); }

  function onContact(st, c) {
    var fa = c.getFixtureA();
    var fb = c.getFixtureB();
    var a = bodyOf(fa);
    var b = bodyOf(fb);
    var va = a.getLinearVelocity();
    var vb = b.getLinearVelocity();
    var rel = Math.hypot(va.x - vb.x, va.y - vb.y);
    st.queue.push({ a: a, b: b, rel: rel, va: Vec2(va.x, va.y), vb: Vec2(vb.x, vb.y) });
  }

  function isMoving(body) { return body.isDynamic(); }

  function processContact(st, a, b, rel, va, vb) {
    var ua = a.getUserData() || {};
    var ub = b.getUserData() || {};
    if (ua.kind === "bullet" || ub.kind === "bullet") {
      var bul = ua.kind === "bullet" ? a : b;
      var other = bul === a ? b : a;
      var uo = other.getUserData() || {};
      if (uo.kind === "mirror" || bul.getUserData().dead) return; // 鏡子讓子彈反彈
      bul.getUserData().dead = true;
      if (uo.kind === "part") {
        if (uo.rag.role === "player") note(st, "block", other);
        else if (uo.rag.role === "hostage") hostageDown(st, "shot");
        else if (uo.rag.role === "enemy") enemyDown(st, uo.rag);
        wake(uo.rag);
      } else if (uo.kind === "tnt") explode(st, other);
      else if (uo.prop && uo.dormant) wakeProp(uo, other);
      else note(st, "ricochet", bul);
      return;
    }
    side(st, a, ua, b, ub, rel, vb);
    side(st, b, ub, a, ua, rel, va);
  }

  function wakeProp(u, body) {
    if (!u.dormant) return;
    u.dormant = false;
    body.setDynamic();
    body.setAwake(true);
  }

  /* 從 self 的角度處理一次碰撞：other 撞到 self。 */
  /* 被教主撞到時額外加速（同一個東西 0.3 秒內只加一次）。vOther＝教主碰撞前的速度。 */
  function kick(st, holder, bodies, vOther, mult, lift) {
    if (holder.kickT !== undefined && st.time - holder.kickT < 0.3) return;
    if (Math.hypot(vOther.x, vOther.y) < 2) return;
    holder.kickT = st.time;
    bodies.forEach(function (b) { b.setLinearVelocity(Vec2(vOther.x * mult, vOther.y * mult + lift)); });
  }

  function side(st, self, us, other, uo, rel, vOther) {
    if (us.kind === "part") {
      var rag = us.rag;
      if (uo.kind === "part" && uo.rag === rag) return;
      if (uo.kind === "thorn") {
        if (rag.role === "hostage") hostageDown(st, "thorn");
        if (rag.role === "enemy") enemyDown(st, rag);
        return;
      }
      if (uo.kind === "spring" && !rag.dormant) {
        rag.list.forEach(function (p) { var v = p.getLinearVelocity(); p.setLinearVelocity(Vec2(v.x, TUNE.springSpeed)); });
        note(st, "spring", self);
        return;
      }
      if (rag.dormant && isMoving(other)) {
        wake(rag);
        if (rag.role === "hostage" && uo.kind === "part" && uo.rag.role === "player") note(st, "duck", self);
      }
      if (rag.role === "hostage" && uo.kind === "part" && uo.rag.role === "player") kick(st, rag, rag.list, vOther, TUNE.hostageKnock, TUNE.hostageLift);
      var dyn = other.isDynamic();
      if (rag.role === "enemy" && rag.alive && rel > (dyn ? TUNE.enemyKill : TUNE.enemyFall)) enemyDown(st, rag);
      // 人質被撞、摔倒都不會受傷（只會趴下）；失敗只來自中彈、尖刺、爆炸、掉出畫面
      return;
    }
    if (us.prop) {
      if (us.dormant && isMoving(other)) wakeProp(us, self);
      if (us.kind === "crate" && uo.kind === "part" && uo.rag.role === "player") kick(st, us, [self], vOther, TUNE.crateKick, 0);
      if (us.kind === "tnt" && rel > TUNE.tntTrigger) explode(st, self);
      return;
    }
    if (us.kind === "spring" && other.isDynamic() && uo.prop) {
      var v = other.getLinearVelocity();
      other.setLinearVelocity(Vec2(v.x, TUNE.springSpeed));
    }
  }

  function note(st, t, body, extra) {
    var p = body ? body.getPosition() : null;
    st.events.push({ t: t, x: p ? p.x * PPM : 0, y: p ? SH - p.y * PPM : 0, extra: extra });
  }

  function enemyDown(st, rag) {
    if (!rag.alive) return;
    rag.alive = false;
    wake(rag);
    note(st, "ko", rag.parts.head);
  }

  function hostageDown(st, reason) {
    if (st.status !== "play" || !st.hostage.alive) return;
    st.hostage.alive = false;
    wake(st.hostage);
    st.reason = reason;
    st.loseT = 0;
    note(st, "hurt", st.hostage.parts.head);
  }

  function explode(st, body) {
    var u = body.getUserData();
    if (u.exploded) return;
    u.exploded = true;
    st.boom = st.boom || [];
    st.boom.push(body);
  }

  function doExplosions(st) {
    while (st.boom && st.boom.length) {
      var tnt = st.boom.shift();
      var c = tnt.getPosition().clone();
      note(st, "boom", tnt);
      st.world.destroyBody(tnt);
      st.props = st.props.filter(function (p) { return p !== tnt; });
      for (var b = st.world.getBodyList(); b; b = b.getNext()) {
        var u = b.getUserData() || {};
        if (u.kind !== "part" && !u.prop) continue;
        var p = b.getWorldCenter();
        var dx = p.x - c.x;
        var dy = p.y - c.y;
        var d = Math.hypot(dx, dy) || 0.01;
        if (d > TUNE.blastR) continue;
        if (u.kind === "part") {
          wake(u.rag);
          if (d < TUNE.blastKillR) {
            if (u.rag.role === "enemy") enemyDown(st, u.rag);
            if (u.rag.role === "hostage") hostageDown(st, "blast");
          }
        } else if (u.prop) {
          if (u.kind === "tnt") { explode(st, b); continue; }
          wakeProp(u, b);
        }
        var f = TUNE.blastPower * (1 - d / TUNE.blastR) * b.getMass();
        b.applyLinearImpulse(Vec2((dx / d) * f, (dy / d) * f + f * 0.4), p, true);
      }
    }
  }

  /* ---- 刺客的槍：瞄準點、槍口、雷射（會被鏡子反射）---- */
  function shoulder(rag) {
    var t = rag.parts.torso;
    return t.getWorldPoint(Vec2(0.25 * TUNE.scale * rag.facing, 0.3 * TUNE.scale));
  }

  function aimDir(st, rag) {
    var s = shoulder(rag);
    var tgt = rag.aim ? Vec2(mx(rag.aim.x), my(rag.aim.y)) : Vec2(mx(st.level.hostage.x), my(st.level.hostage.y) + 1.9 * TUNE.scale);
    var d = Vec2(tgt.x - s.x, tgt.y - s.y);
    var l = Math.hypot(d.x, d.y) || 1;
    return Vec2(d.x / l, d.y / l);
  }

  function muzzle(st, rag) {
    var s = shoulder(rag);
    var d = aimDir(st, rag);
    return Vec2(s.x + d.x * 0.62 * TUNE.scale, s.y + d.y * 0.62 * TUNE.scale);
  }

  function laser(st, rag) {
    var pts = [];
    var from = muzzle(st, rag);
    var dir = aimDir(st, rag);
    pts.push(from);
    for (var bounce = 0; bounce < 4; bounce++) {
      var to = Vec2(from.x + dir.x * 40, from.y + dir.y * 40);
      var hit = null;
      st.world.rayCast(from, to, function (fx, point, normal, fraction) {
        var u = fx.getBody().getUserData() || {};
        if (u.kind === "part" && u.rag === rag) return -1;
        if (u.kind === "bullet") return -1;
        hit = { point: point.clone(), normal: normal.clone(), kind: u.kind };

      if (!hit) { pts.push(to); break; }
      pts.push(hit.point);
      if (hit.kind !== "mirror") break;
      var dot = dir.x * hit.normal.x + dir.y * hit.normal.y;
      dir = Vec2(dir.x - 2 * dot * hit.normal.x, dir.y - 2 * dot * hit.normal.y);
      from = Vec2(hit.point.x + dir.x * 0.02, hit.point.y + dir.y * 0.02);

  function fire(st) {
    st.fired = true;
    var any = false;
    st.enemies.forEach(function (rag) {
      if (!rag.alive) return;
      any = true;
      var m = muzzle(st, rag);
      var d = aimDir(st, rag);
      var b = st.world.createBody({ type: "dynamic", position: m, bullet: true });
      b.createFixture(pl.Circle(0.03), { density: 20, friction: 0, restitution: 1, filterGroupIndex: -rag.group }); // 判定半徑和紅線一致

    var dx = (fingerX - c.x) * TUNE.launchScale;
    var dy = -(fingerY - c.y) * TUNE.launchScale;

    st.throwsLeft--;

      b.setAngularVelocity(0);

  function preview(st, vx, vy) {
    var c = st.player.parts.torso.getWorldCenter();
    var pts = [];
    var prev = Vec2(c.x, c.y);
    for (var i = 1; i <= 34; i++) { // 預覽點數：越多拋物線畫得越長

        return 0;
      });
      if (blocked) break;

      st.time += 1 / 120;
      var q = st.queue;
      st.queue = [];
      q.forEach(function (c) { processContact(st, c.a, c.b, c.rel, c.va, c.vb); });
      doExplosions(st);
      st.bullets = st.bullets.filter(function (b) {
        var u = b.getUserData();
        u.age += 1 / 120;
        var p = b.getPosition();
        if (u.dead || u.age > 5 || p.y < -2 || p.x < -2 || p.x > SW / PPM + 2) {
          st.world.destroyBody(b);
          return false;
        }
        return true;
      });
      if (!st.fired && st.time >= TUNE.fireAt) fire(st);
    }
    // 掉出畫面的人質＝失敗
    if (st.hostage.alive && st.hostage.parts.torso.getPosition().y < -1) hostageDown(st, "fall");
    if (!st.hostage.alive) {
      st.loseT += realDt;
      if (st.loseT > 0.9) { st.status = "lost"; st.events.push({ t: "lose" }); }
      return;
    }
    var allDown = st.enemies.every(function (e) { return !e.alive; });
    if ((st.fired || allDown) && st.bullets.length === 0) {
      st.winT += dt;
      if (st.winT > TUNE.winDelay) { st.status = "won"; st.events.push({ t: "win" }); }

  }

    TUNE: TUNE,
    PPM: PPM,
    SW: SW,
    SH: SH,
    create: create,

    launch: launch,
    aimVelocity: aimVelocity,
    preview: preview,
    laser: laser,
    playerCenter: playerCenter,
    stars: stars,
  };

    ctx.restore();
  }

  /* 一個身體部位：有圖用圖（圖的上緣接關節），沒圖畫圓角矩形。 */
  function drawPart(rag, b) {
    var u = b.getUserData();
    var role = ROLES[rag.role];
    var p = bodyPx(b);
    var w = u.w * PPM * cam.s;
    var h = u.h * PPM * cam.s;
    var kind = u.part.replace(/[LR]$/, "");
    ctx.save();
    ctx.translate(sx(p.x), sy(p.y));
    ctx.rotate(p.a);
    ctx.scale(rag.facing, 1);
    var art = ART[rag.role + "_" + kind];
    if (art) {
      ctx.drawImage(art, -w / 2, -h / 2, w, h);
      ctx.restore();
      return;
    }
    if (kind === "head") {
      var r = w / 2;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      inked(role.skin, 2);
      ctx.fillStyle = role.hair;
      ctx.beginPath();
      ctx.arc(0, -r * 0.15, r * 1.02, Math.PI * 1.05, Math.PI * 1.95);
      ctx.fill();
      if (rag.role === "enemy") {
        ctx.fillStyle = role.trim;
        ctx.fillRect(-r, r * 0.05, r * 2, r * 0.35);
      }
      if (rag.role === "hostage") {
        ctx.fillStyle = role.hair;
        ctx.fillRect(-r * 1.05, -r * 0.2, r * 0.35, r * 1.2);
      }
      // 眼睛：倒下（死亡）畫叉叉
      ctx.strokeStyle = "#1b1726";
      ctx.fillStyle = "#1b1726";
      ctx.lineWidth = Math.max(1.2, r * 0.12);
      var dead = !rag.alive;
      [-0.35, 0.3].forEach(function (ex) {
        if (dead) {
          ctx.beginPath();
          ctx.moveTo(r * ex - r * 0.12, -r * 0.02);
          ctx.lineTo(r * ex + r * 0.12, r * 0.2);
          ctx.moveTo(r * ex + r * 0.12, -r * 0.02);
          ctx.lineTo(r * ex - r * 0.12, r * 0.2);
          ctx.stroke();
        } else {
          ctx.beginPath();
          ctx.arc(r * ex + r * 0.15, r * 0.08, r * 0.11, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    } else {
      rr(-w / 2, -h / 2, w, h, Math.min(w, h) * 0.45);
      inked(kind === "torso" ? role.body : kind === "uarm" || kind === "larm" ? (rag.role === "hostage" ? role.skin : role.limb) : role.limb, 2);
      if (kind === "torso") {
        ctx.fillStyle = role.trim;
        ctx.fillRect(-w / 2 + 2, -h * 0.05, w - 4, h * 0.12);
        if (rag.role === "hostage") {
          ctx.beginPath();
          ctx.moveTo(-w * 0.75, h / 2);
          ctx.lineTo(w * 0.75, h / 2);
          ctx.lineTo(w * 0.5, 0);
          ctx.lineTo(-w * 0.5, 0);
          ctx.closePath();
          inked(role.body, 2);
        }
      }
    }
    ctx.restore();
  }

  function drawRag(rag) {
    rag.list.forEach(function (b) { drawPart(rag, b); });
    if (rag.role === "enemy" && rag.alive && state.status === "play") {
      // 槍：從肩膀朝瞄準方向
      var pts = G.laser(state, rag);
      var a = pts[0];
      var t = rag.parts.torso;
      var sh = t.getWorldPoint(window.planck.Vec2(0.25 * G.TUNE.scale * rag.facing, 0.3 * G.TUNE.scale));
      var shx = sx(sh.x * PPM);
      var shy = sy(G.SH - sh.y * PPM);
      ctx.save();
      ctx.translate(shx, shy);
      ctx.rotate(Math.atan2(sy(a.y) - shy, sx(a.x) - shx));
      if (ART.gun) ctx.drawImage(ART.gun, 0, -5 * cam.s, 22 * cam.s, 10 * cam.s);
      else {
        rr(0, -3 * cam.s, 20 * cam.s, 6 * cam.s, 2);
        inked("#2a2a30", 1.5);
      }
      ctx.restore();
    }
    if (rag.role === "hostage" && rag.alive && state.status === "play") {
      var hp = bodyPx(rag.parts.head);
      ctx.font = "bold " + Math.round(10 * cam.s) + "px sans-serif";
      ctx.textAlign = "center";
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#1b1726";
      ctx.strokeText(ROLES.hostage.name, sx(hp.x), sy(hp.y - 20));
      ctx.fillStyle = "#fff";
      ctx.fillText(ROLES.hostage.name, sx(hp.x), sy(hp.y - 20));
    }
  }

  function drawLaser(pts) {
    ctx.save();
    ctx.lineCap = "round";
    ctx.beginPath();
    pts.forEach(function (p, i) { if (i) ctx.lineTo(sx(p.x), sy(p.y)); else ctx.moveTo(sx(p.x), sy(p.y)); });
    ctx.strokeStyle = "rgba(255, 50, 70, 0.3)";
    ctx.lineWidth = 7 * cam.s;
    ctx.stroke();
    ctx.strokeStyle = "#ff3346";
    ctx.lineWidth = 1.6 * cam.s;
    ctx.stroke();
    ctx.restore();
  }

  function drawWorld(dt) {
    var w = state.world;
    var statics = [];
    for (var b = w.getBodyList(); b; b = b.getNext()) {
      var u = b.getUserData() || {};
      if (!u.prop && u.kind !== "part" && u.kind !== "bullet") statics.push(b);
    }
    statics.forEach(drawStatic);
    state.props.forEach(drawProp);
    if (!state.fired && state.status === "play") state.enemies.forEach(function (e) { if (e.alive) drawLaser(G.laser(state, e)); });
    state.enemies.forEach(drawRag);
    drawRag(state.hostage);
    drawRag(state.player);
    state.bullets.forEach(function (bl) {
      var p = bodyPx(bl);
      var v = bl.getLinearVelocity();
      ctx.save();
      ctx.translate(sx(p.x), sy(p.y));
      ctx.rotate(Math.atan2(-v.y, v.x));
      if (ART.bullet) ctx.drawImage(ART.bullet, -6 * cam.s, -3 * cam.s, 12 * cam.s, 6 * cam.s);
      else {
        rr(-6 * cam.s, -2.5 * cam.s, 12 * cam.s, 5 * cam.s, 2);
        inked("#ffe08a", 1);
      }
      ctx.restore();
    });
    if (aiming && aiming.preview) {
      aiming.preview.forEach(function (p, i) {
        ctx.globalAlpha = 1 - i / 38;
        ctx.beginPath();
        ctx.arc(sx(p.x), sy(p.y), (3.2 - i * 0.05) * cam.s, 0, Math.PI * 2);
        inked("#fff", 1);
      });
      ctx.globalAlpha = 1;
    }
    // 倒數
    if (!state.fired && state.status === "play") {
      var n = Math.ceil(G.TUNE.fireAt - state.time);
      if (n > 0) {
        var hx = state.level.hostage.x;
        var hy = state.level.hostage.y - 100;
        ctx.beginPath();
        ctx.arc(sx(hx), sy(hy), 16 * cam.s, 0, Math.PI * 2);
        inked("#fff", 3);
        ctx.fillStyle = "#1b1726";
        ctx.font = "bold " + Math.round(18 * cam.s) + "px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(String(n), sx(hx), sy(hy) + 1);
      }
    }
    // 特效文字
    fx = fx.filter(function (f) { return (f.t += dt) < 0.9; });
    fx.forEach(function (f) {
      var k = f.t / 0.9;
      if (f.ring) {
        ctx.beginPath();
        ctx.arc(sx(f.x), sy(f.y), G.TUNE.blastR * PPM * cam.s * (0.3 + k * 0.7), 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255, 200, 90," + (0.5 * (1 - k)) + ")";
        ctx.fill();
        return;
      }
      ctx.globalAlpha = 1 - k;
      ctx.font = "900 " + Math.round(14 * cam.s) + "px sans-serif";
      ctx.textAlign = "center";
      ctx.lineWidth = 4;
      ctx.strokeStyle = "#1b1726";
      ctx.strokeText(f.text, sx(f.x), sy(f.y - k * 24));
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, sx(f.x), sy(f.y - k * 24));
      ctx.globalAlpha = 1;
    });
    if (state.slow > 0) {
      ctx.fillStyle = "rgba(20, 10, 40, 0.18)";
      ctx.fillRect(0, 0, cssW, cssH);
    }
  }

  function consume() {
    state.events.splice(0).forEach(function (e) {
      if (e.t === "block") { fx.push({ x: e.x, y: e.y - 20, t: 0, text: "擋下！", color: "#7fe0ff" }); shake = 6; }
      if (e.t === "ko") { fx.push({ x: e.x, y: e.y - 20, t: 0, text: "擊倒！", color: "#ffd15a" }); shake = 8; }
      if (e.t === "duck") fx.push({ x: e.x, y: e.y - 20, t: 0, text: "趴下！", color: "#b9ffb0" });
      if (e.t === "boom") { fx.push({ x: e.x, y: e.y, t: 0, ring: true }); fx.push({ x: e.x, y: e.y - 10, t: 0, text: "轟！", color: "#ff9a3c" }); shake = 14; }
      if (e.t === "hurt") { fx.push({ x: e.x, y: e.y - 20, t: 0, text: "啊！", color: "#ff6b7a" }); shake = 10; }
      if (e.t === "spring") fx.push({ x: e.x, y: e.y, t: 0, text: "彈！", color: "#ffd15a" });
      if (e.t === "win") setTimeout(showWin, 500);
      if (e.t === "lose") setTimeout(showLose, 400);
    });
  }

  /* ---- 介面 ---- */
  var $ = function (id) { return document.getElementById(id); };
  var REASONS = { shot: "艾爾莎中彈了。", thorn: "艾爾莎掉進尖刺了。", blast: "艾爾莎被爆炸波及了。", fall: "艾爾莎掉下去了。" };

  function show(name) {
    screen = name;
    ["title", "select", "result"].forEach(function (s) { $("scr-" + s).hidden = s !== name; });
    $("hud").hidden = name !== "play" && name !== "result";
    if (name === "select") buildSelect();
  }

  function buildSelect() {
    var grid = $("grid");
    grid.innerHTML = "";
    L.forEach(function (lv) {
      var open = lv.id === 1 || save.stars[lv.id - 1] > 0;
      var b = document.createElement("button");
      b.className = "card";
      b.disabled = !open;
      var st = save.stars[lv.id] || 0;
      b.innerHTML = "<b>" + lv.id + "</b><span>" + lv.name + "</span><i>" + (open ? "★★★".slice(0, st) + "☆☆☆".slice(st) : "未解鎖") + "</i>";
      b.onclick = function () { start(lv.id); };
      grid.appendChild(b);
    });
  }

  function start(id) {
    var lv = L.filter(function (x) { return x.id === id; })[0];
    state = G.create(lv);
    fx = [];
    aiming = null;
    $("lv").textContent = lv.id + "．" + lv.name;
    $("hint").textContent = lv.hint;
    updateHud();
    show("play");
  }

  function updateHud() {
    var dots = "";
    for (var i = 0; i < state.level.throws; i++) dots += i < state.throwsLeft ? "●" : "○";
    $("throws").textContent = "擲出 " + dots;
  }

  function showWin() {
    if (!state || state.status !== "won") return;
    var s = G.stars(state);
    if (s > (save.stars[state.level.id] || 0)) { save.stars[state.level.id] = s; persist(); }
    $("res-title").textContent = "護衛成功";
    $("res-text").textContent = "★★★".slice(0, s) + "☆☆☆".slice(s);
    $("res-next").hidden = state.level.id >= L.length;
    show("result");
  }

  function showLose() {
    if (!state || state.status !== "lost") return;
    $("res-title").textContent = "護衛失敗";
    $("res-text").textContent = REASONS[state.reason] || "";
    $("res-next").hidden = true;
    show("result");
  }

  function toDesign(e) {
    var r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left - cam.x) / cam.s, y: (e.clientY - r.top - cam.y) / cam.s };
  }

  canvas.addEventListener("pointerdown", function (e) {
    if (screen !== "play" || !state || state.status !== "play" || state.throwsLeft <= 0) return;
    aiming = { p: toDesign(e) };
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", function (e) { if (aiming) aiming.p = toDesign(e); });
  canvas.addEventListener("pointerup", function () {
    if (!aiming || !state) return;
    var v = G.aimVelocity(state, aiming.p.x, aiming.p.y);
    aiming = null;
    if (Math.hypot(v.vx, v.vy) < 2) return;
    G.launch(state, v.vx, v.vy);
    updateHud();
  });
  canvas.addEventListener("pointercancel", function () { aiming = null; });

  $("btn-start").onclick = function () { show("select"); };
  $("btn-back").onclick = function () { show("select"); };
  $("btn-retry").onclick = function () { if (state) start(state.level.id); };
  $("res-retry").onclick = function () { start(state.level.id); };
  $("res-next").onclick = function () { start(state.level.id + 1); };
  $("res-menu").onclick = function () { show("select"); };
  $("sel-back").onclick = function () { show("title"); };

  function loop(t) {
    requestAnimationFrame(loop);
    var dt = lastT ? Math.min(0.05, (t - lastT) / 1000) : 0;
    lastT = t;
    ctx.save();
    if (shake > 0.3) { ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake); shake *= 0.85; }
    drawBackground();
    if (state && (screen === "play" || screen === "result")) {
      if (screen === "play") {
        G.step(state, dt);
        if (aiming) {
          var v = G.aimVelocity(state, aiming.p.x, aiming.p.y);
          aiming.preview = G.preview(state, v.vx, v.vy);
        }
        consume();
      }
      drawWorld(dt);
    }
    ctx.restore();
  }

  window.addEventListener("resize", resize);
  resize();
  show("title");
  requestAnimationFrame(loop);
  window.__GUARD = { start: start, get state() { return state; }, draw: function (dt) { drawBackground(); drawWorld(dt); }, consume: function () { consume(); } };
})();
</script>
</body>
</html>
